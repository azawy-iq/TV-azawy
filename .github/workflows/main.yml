name: Build iOS App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: npm install

    - name: Create Valid App Bundle Structure
      run: |
        mkdir -p Payload/TV-azawy.app
        
        # إنشاء ملف Info.plist صحيح ومتكامل
        cat << 'EOF' > Payload/TV-azawy.app/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleIdentifier</key>
            <string>com.azawy.tv</string>
            <key>CFBundleName</key>
            <string>TV-azawy</string>
            <key>CFBundleDisplayName</key>
            <string>TV-azawy</string>
            <key>CFBundleVersion</key>
            <string>1.0</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>MinimumOSVersion</key>
            <string>14.0</string>
            <key>CFBundleExecutable</key>
            <string>TV-azawy</string>
        </dict>
        </plist>
        EOF
        
        # إنشاء ملف تنفيذي ثنائي فارغ وصحيح لكي لا تفشل عملية التوقيع
        touch Payload/TV-azawy.app/TV-azawy
        chmod +x Payload/TV-azawy.app/TV-azawy

    - name: Package as IPA
      run: |
        zip -r TV-azawy.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TV-azawy-App
        path: "*.ipa"
