name: Build IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Compile and Create App Bundle
      run: |
        # 1. إنشاء مجلد التطبيق باسم TVazawy.app
        mkdir -p build/Payload/TVazawy.app
        
        # 2. تجميع الأكواد وإنشاء الملف التنفيذي باسم TVazawy
        swiftc -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
               -target arm64-apple-ios14.0 \
               -emit-executable \
               -framework UIKit \
               -framework WebKit \
               -framework AVFoundation \
               -o build/Payload/TVazawy.app/TVazawy \
               main.swift AppDelegate.swift ViewController.swift
        
        # 3. نسخ ملف Info.plist والأيقونة داخل المجلد الجديد
        cp Info.plist build/Payload/TVazawy.app/Info.plist
        if [ -f "AppIcon.png" ]; then
          cp AppIcon.png build/Payload/TVazawy.app/AppIcon.png
        fi

    - name: Create IPA File
      run: |
        cd build
        # ضغط مجلد Payload لإنتاج TVazawy.ipa
        zip -q -r TVazawy.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TVazawy-Ready-IPA
        path: build/TVazawy.ipa
