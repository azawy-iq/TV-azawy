name: Build Strofy IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm install

    - name: Add iOS platform (Capacitor)
      run: |
        npx cap add ios || true
        npx cap sync ios

    - name: Build unsigned .app
      run: |
        cd ios/App
        xcodebuild -workspace App.xcworkspace \
                   -scheme App \
                   -sdk iphoneos \
                   -configuration Release \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO \
                   build

    - name: Package as direct clean .ipa
      run: |
        mkdir -p Payload
        cp -r ios/App/build/Release-iphoneos/App.app Payload/Strofy.app
        zip -r Strofy.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Strofy-Ready-IPA
        path: Strofy.ipa
