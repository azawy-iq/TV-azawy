name: Build IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Compile and Create App Bundle
      run: |
        mkdir -p build/Payload/Starcima.app
        
        # 1. تجميع ملفات السويفت
        swiftc -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
               -target arm64-apple-ios14.0 \
               -emit-executable \
               -framework UIKit \
               -framework WebKit \
               -o build/Payload/Starcima.app/Starcima \
               main.swift AppDelegate.swift ViewController.swift
        
        # 2. إنشاء شاشة بداية وهمية برمجياً لتفعيل أبعاد الشاشة الكاملة لجهاز 12 Pro Max وتخطي الإطار الأسود
        mkdir -p build/Payload/Starcima.app/Base.lproj
        cat << 'EOF' > build/LaunchScreen.storyboard
        <?xml version="1.0" encoding="UTF-8"?>
        <document type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB" version="3.0" toolsVersion="21507" targetRuntime="iOS.CocoaTouch" propertyAccessControl="none" useAutolayout="YES" launchScreen="YES" useTraitCollections="YES" useSafeAreas="YES" colorMatched="YES" initialViewController="01J-lp-oVM">
            <device id="retina6_7" orientation="portrait" appearance="light"/>
            <dependencies>
                <plugIn identifier="com.apple.InterfaceBuilder.IBCocoaTouchPlugin" version="21505"/>
                <capability name="Safe area layout guides" minToolsVersion="9.0"/>
                <capability name="documents saved in the Xcode 8 format" minToolsVersion="8.0"/>
            </dependencies>
            <scenes>
                <scene sceneID="EHf-IW-A2E">
                    <objects>
                        <viewController id="01J-lp-oVM" sceneMemberID="viewController">
                            <view key="view" contentMode="scaleToFill" id="Ze5-6b-2t3">
                                <rect key="frame" x="0.0" y="0.0" width="428" height="926"/>
                                <autoresizingMask key="autoresizingMask" widthSizable="YES" heightSizable="YES"/>
                                <color key="backgroundColor" red="0.0" green="0.0" blue="0.0" alpha="1" colorSpace="custom" customColorSpace="sRGB"/>
                                <viewLayoutGuide key="safeArea" id="6Tk-OE-BBY"/>
                            </view>
                        </viewController>
                        <placeholder placeholderIdentifier="IBFirstResponder" id="iYj-Kq-Ea1" userLabel="First Responder" sceneMemberID="firstResponder"/>
                    </objects>
                </scene>
            </scenes>
        </document>
        EOF

        # 3. تجميع Storyboard ليفهمه نظام iOS ويمنح التطبيق أبعاد 12 Pro Max
        ibtool --compile build/Payload/Starcima.app/Base.lproj/LaunchScreen.storyboardc build/LaunchScreen.storyboard

        cp Info.plist build/Payload/Starcima.app/Info.plist

    - name: Create IPA
      run: |
        cd build
        zip -r Starcima.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Starcima-IPA
        path: build/Starcima.ipa
