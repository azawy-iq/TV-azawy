name: Build IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Compile and Create App Bundle
      run: |
        mkdir -p build/Payload/Starcima.app
        
        swiftc -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
               -target arm64-apple-ios14.0 \
               -emit-executable \
               -framework UIKit \
               -framework WebKit \
               -o build/Payload/Starcima.app/Starcima \
               main.swift AppDelegate.swift ViewController.swift
        
        cp Info.plist build/Payload/Starcima.app/Info.plist

    - name: Create IPA
      run: |
        cd build
        zip -r Starcima.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Starcima-IPA
        path: build/Starcima.ipa
