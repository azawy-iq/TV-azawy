name: Build IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Compile and Create App Bundle
      run: |
        mkdir -p build/Payload/Starcima.app
        
        # 1. تجميع الأكواد
        swiftc -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
               -target arm64-apple-ios14.0 \
               -emit-executable \
               -framework UIKit \
               -framework WebKit \
               -framework AVFoundation \
               -o build/Payload/Starcima.app/Starcima \
               main.swift AppDelegate.swift ViewController.swift
        
        # 2. نسخ ملف Info.plist والأيقونة
        cp Info.plist build/Payload/Starcima.app/Info.plist
        if [ -f "AppIcon.png" ]; then
          cp AppIcon.png build/Payload/Starcima.app/AppIcon.png
        fi

    - name: Create IPA File
      run: |
        cd build
        # ضغط مجلد Payload مباشرة بصيغة ZIP مع حماية الأذونات
        zip -q -r Starcima.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Starcima-Ready-IPA
        path: build/Starcima.ipa
