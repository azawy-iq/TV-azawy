name: Build iOS App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: npm install

    - name: Add iOS platform (Capacitor)
      run: npx cap add ios || true

    - name: Build unsigned .app
      run: |
        echo "Building app..."

    - name: Package as direct clean .ipa
      run: |
        echo "Packaging IPA..."

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TV-azawy-App
        path: |
          *.ipa
